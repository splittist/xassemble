[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xassemble"
version = "0.1.0"
description = "Small, self-hosted document assembly service"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "argon2-cffi>=23.1,<26",
  "docxtpl>=0.19,<1",
  "fastapi>=0.115,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
xassemble-user = "xassemble.user_cli:main"
xassemble-db = "xassemble.database_cli:main"
xassemble-manual = "xassemble.manual:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xassemble"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"
